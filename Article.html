<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Article - NgobrolQA</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon-192.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <meta name="author" content="Aditya Mirza Bahari">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f62f0;
            --navy: #071c44;
            --primary-dark: #0a47b8;
            --secondary: #071c44;
            --bg: #f4f7fb;
            --card: #ffffff;
            --text: #0f1f3d;
            --text-muted: #55657f;
            --border: #dbe3ef;
            --danger: #dc2626;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        nav {
            background: var(--navy);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .nav-content { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .nav-brand { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: white; }
        .nav-brand img { height: 40px; }
        .nav-brand span { font-weight: 700; font-size: 1.25rem; }
        .nav-brand span .qa { color: #5a9bff; }
        .nav-links { display: flex; gap: 1.5rem; align-items: center; }
        .nav-links a { color: rgba(255,255,255,0.9); text-decoration: none; font-weight: 500; font-size: 0.9rem; transition: color 0.2s; }
        .nav-links a:hover { color: white; }

        .container { max-width: 720px; margin: 0 auto; padding: 2rem; }

        .card { background: var(--card); border-radius: 20px; padding: 2.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 1.5rem; }

        .article-title { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; line-height: 1.25; }
        .article-meta { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.75rem; }

        .article-body { font-size: 1.05rem; }
        .article-body p { margin-bottom: 1rem; }
        .article-body h1, .article-body h2, .article-body h3 { margin: 1.5rem 0 0.75rem; font-weight: 700; }
        .article-body ul, .article-body ol { margin: 0 0 1rem 1.5rem; }
        .article-body img { max-width: 100%; border-radius: 12px; margin: 1rem 0; }
        .article-body a { color: var(--primary); }
        .article-body blockquote {
            border-left: 4px solid var(--primary); padding-left: 1rem; margin: 1rem 0;
            color: var(--text-muted); font-style: italic;
        }

        .article-body .ql-ui { display: none; }
        .article-body li[data-list="bullet"] { list-style-type: disc; }
        .article-body li[data-list="ordered"] { list-style-type: decimal; }

        .not-found { text-align: center; padding: 2rem 0; color: var(--text-muted); }

        footer { background: var(--navy); color: white; padding: 2rem; text-align: center; margin-top: 2rem; }
        footer a { color: white; text-decoration: none; }

        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .card { padding: 1.5rem; }
            .article-title { font-size: 1.5rem; }
            .nav-links a:not(.nav-brand) { display: none; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-content">
            <a href="index.html" class="nav-brand">
                <img src="ngobrolqa-mark-reversed.svg" alt="NgobrolQA" onerror="this.style.display='none'">
                <span>Ngobrol<span class="qa">QA</span></span>
            </a>
            <div class="nav-links">
                <a href="index.html">Home</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card" id="articleCard">
            <p class="not-found">Loading…</p>
        </div>
    </div>

    <footer>
        <p>© 2026 Aditya Mirza Bahari. All Rights Reserved.</p>
        <p style="margin-top: 0.5rem; opacity: 0.8;">
            <a href="https://id.linkedin.com/in/adityamirzabahari" target="_blank">LinkedIn</a> •
            <a href="https://www.instagram.com/ngobrolqa/" target="_blank">Instagram</a> •
            <a href="https://www.youtube.com/@ngobrolQA" target="_blank">YouTube</a> •
            <a href="https://open.spotify.com/show/NgobrolQA" target="_blank">Podcast</a> •
            <a href="https://idstb.org" target="_blank">IDSTB</a>
        </p>
    </footer>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzq55gjVwckD9mzKKl0vy1G_4pHYgQ5jad-tZ21b1Ve6azWx4zBy2CXoj2u969nhf2aSw/exec';

        // Article bodies come from the admin editor, but the endpoint that stores them can be
        // called by anyone who learns the admin password, so the HTML is never trusted:
        // it is rebuilt from an allowlist of tags and attributes instead of injected as-is.
        const ALLOWED_TAGS = ['P', 'BR', 'STRONG', 'B', 'EM', 'I', 'U', 'S', 'H1', 'H2', 'H3', 'H4', 'UL', 'OL', 'LI',
            'BLOCKQUOTE', 'A', 'IMG', 'PRE', 'CODE', 'SPAN', 'DIV', 'HR', 'SUB', 'SUP'];
        const DROP_TAGS = ['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'LINK', 'META', 'BASE', 'FORM', 'INPUT', 'BUTTON',
            'TEXTAREA', 'SELECT', 'SVG', 'MATH', 'TEMPLATE', 'NOSCRIPT', 'VIDEO', 'AUDIO', 'SOURCE', 'TRACK', 'CANVAS',
            'FRAME', 'FRAMESET', 'APPLET', 'HEAD', 'TITLE'];
        const LIST_TYPES = ['bullet', 'ordered', 'checked', 'unchecked'];

        function safeUrl(value, allowMailto) {
            try {
                const url = new URL(String(value).trim(), window.location.href);
                if (url.protocol === 'https:' || url.protocol === 'http:') return url.href;
                if (allowMailto && url.protocol === 'mailto:') return url.href;
            } catch (e) { /* not a URL */ }
            return null;
        }

        function cleanChildren(source, target) {
            source.childNodes.forEach(function (node) {
                if (node.nodeType === Node.TEXT_NODE) {
                    target.appendChild(document.createTextNode(node.nodeValue));
                    return;
                }
                if (node.nodeType !== Node.ELEMENT_NODE) return;
                const tag = node.tagName.toUpperCase();
                if (DROP_TAGS.indexOf(tag) !== -1) return;
                if (ALLOWED_TAGS.indexOf(tag) === -1) { cleanChildren(node, target); return; }

                const el = document.createElement(tag.toLowerCase());
                const classes = (node.getAttribute('class') || '').split(/\s+/).filter(function (c) { return /^ql-[a-z0-9-]+$/.test(c); });
                if (classes.length) el.className = classes.join(' ');

                if (tag === 'A') {
                    const href = safeUrl(node.getAttribute('href') || '', true);
                    if (href) {
                        el.setAttribute('href', href);
                        el.setAttribute('target', '_blank');
                        el.setAttribute('rel', 'noopener noreferrer');
                    }
                } else if (tag === 'IMG') {
                    const src = safeUrl(node.getAttribute('src') || '', false);
                    if (!src || src.indexOf('https:') !== 0) return;
                    el.setAttribute('src', src);
                    el.setAttribute('alt', node.getAttribute('alt') || '');
                    el.setAttribute('loading', 'lazy');
                } else if (tag === 'LI') {
                    const listType = node.getAttribute('data-list');
                    if (LIST_TYPES.indexOf(listType) !== -1) el.setAttribute('data-list', listType);
                }
                cleanChildren(node, el);
                target.appendChild(el);
            });
        }

        function sanitizeToFragment(html) {
            // DOMParser documents are inert: nothing runs and nothing loads while we read it.
            const doc = new DOMParser().parseFromString('<!doctype html><body>' + String(html || ''), 'text/html');
            const fragment = document.createDocumentFragment();
            cleanChildren(doc.body, fragment);
            return fragment;
        }

        async function loadArticle() {
            const slug = new URLSearchParams(window.location.search).get('slug');
            const card = document.getElementById('articleCard');
            if (!slug) {
                card.innerHTML = '<p class="not-found">No article specified.</p>';
                return;
            }
            try {
                const res = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'getArticle', slug: slug }),
                });
                const data = await res.json();
                if (data.error) {
                    card.innerHTML = '<p class="not-found">Article not found.</p>';
                    return;
                }
                document.title = data.title + ' - NgobrolQA';
                document.getElementById('pageTitle').textContent = data.title + ' - NgobrolQA';
                const updated = data.updatedAt ? new Date(data.updatedAt).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : '';
                card.innerHTML =
                    '<h1 class="article-title">' + escapeHtml(data.title) + '</h1>' +
                    (updated ? '<p class="article-meta">Last updated ' + updated + '</p>' : '');
                const bodyEl = document.createElement('div');
                bodyEl.className = 'article-body';
                bodyEl.appendChild(sanitizeToFragment(data.bodyHtml));
                card.appendChild(bodyEl);
            } catch (err) {
                card.innerHTML = '<p class="not-found">Failed to load article: ' + escapeHtml(err.message) + '</p>';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            // Also escape quotes so this stays safe if ever used inside an HTML
            // attribute value, not just text content (see Admin.html for why this
            // matters — the same gap there caused a real quote-collision bug).
            return div.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        loadArticle();
    </script>
</body>
</html>
