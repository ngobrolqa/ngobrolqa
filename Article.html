<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Article - NgobrolQA</title>

    <meta name="author" content="Aditya Mirza Bahari">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0d9488;
            --primary-dark: #0f766e;
            --secondary: #6366f1;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #dc2626;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        nav {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .nav-content { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .nav-brand { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: white; }
        .nav-brand img { height: 40px; border-radius: 8px; }
        .nav-brand span { font-weight: 700; font-size: 1.25rem; }
        .nav-links { display: flex; gap: 1.5rem; align-items: center; }
        .nav-links a { color: rgba(255,255,255,0.9); text-decoration: none; font-weight: 500; font-size: 0.9rem; transition: color 0.2s; }
        .nav-links a:hover { color: white; }

        .container { max-width: 720px; margin: 0 auto; padding: 2rem; }

        .card { background: var(--card); border-radius: 20px; padding: 2.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 1.5rem; }

        .article-title { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; line-height: 1.25; }
        .article-meta { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.75rem; }

        .article-body { font-size: 1.05rem; }
        .article-body p { margin-bottom: 1rem; }
        .article-body h1, .article-body h2, .article-body h3 { margin: 1.5rem 0 0.75rem; font-weight: 700; }
        .article-body ul, .article-body ol { margin: 0 0 1rem 1.5rem; }
        .article-body img { max-width: 100%; border-radius: 12px; margin: 1rem 0; }
        .article-body a { color: var(--primary); }
        .article-body blockquote {
            border-left: 4px solid var(--primary); padding-left: 1rem; margin: 1rem 0;
            color: var(--text-muted); font-style: italic;
        }

        .not-found { text-align: center; padding: 2rem 0; color: var(--text-muted); }

        footer { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; padding: 2rem; text-align: center; margin-top: 2rem; }
        footer a { color: white; text-decoration: none; }

        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .card { padding: 1.5rem; }
            .article-title { font-size: 1.5rem; }
            .nav-links a:not(.nav-brand) { display: none; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-content">
            <a href="index.html" class="nav-brand">
                <img src="ngobrolqa-logo.png" alt="NgobrolQA" onerror="this.style.display='none'">
                <span>NgobrolQA</span>
            </a>
            <div class="nav-links">
                <a href="index.html">Home</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card" id="articleCard">
            <p class="not-found">Loading…</p>
        </div>
    </div>

    <footer>
        <p>© 2026 Aditya Mirza Bahari. All Rights Reserved.</p>
        <p style="margin-top: 0.5rem; opacity: 0.8;">
            <a href="https://id.linkedin.com/in/adityamirzabahari" target="_blank">LinkedIn</a> •
            <a href="https://www.instagram.com/ngobrolqa/" target="_blank">Instagram</a> •
            <a href="https://www.youtube.com/@ngobrolQA" target="_blank">YouTube</a> •
            <a href="https://open.spotify.com/show/NgobrolQA" target="_blank">Podcast</a> •
            <a href="https://idstb.org" target="_blank">IDSTB</a>
        </p>
    </footer>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzq55gjVwckD9mzKKl0vy1G_4pHYgQ5jad-tZ21b1Ve6azWx4zBy2CXoj2u969nhf2aSw/exec';

        async function loadArticle() {
            const slug = new URLSearchParams(window.location.search).get('slug');
            const card = document.getElementById('articleCard');
            if (!slug) {
                card.innerHTML = '<p class="not-found">No article specified.</p>';
                return;
            }
            try {
                const res = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'getArticle', slug: slug }),
                });
                const data = await res.json();
                if (data.error) {
                    card.innerHTML = '<p class="not-found">Article not found.</p>';
                    return;
                }
                document.title = data.title + ' - NgobrolQA';
                document.getElementById('pageTitle').textContent = data.title + ' - NgobrolQA';
                const updated = data.updatedAt ? new Date(data.updatedAt).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : '';
                card.innerHTML =
                    '<h1 class="article-title">' + escapeHtml(data.title) + '</h1>' +
                    (updated ? '<p class="article-meta">Last updated ' + updated + '</p>' : '') +
                    '<div class="article-body">' + data.bodyHtml + '</div>';
            } catch (err) {
                card.innerHTML = '<p class="not-found">Failed to load article: ' + escapeHtml(err.message) + '</p>';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        loadArticle();
    </script>
</body>
</html>
